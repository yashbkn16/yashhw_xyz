<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap">
<style>
  html,body{margin:0}
  .card{width:1200px;height:630px;box-sizing:border-box;padding:84px 96px;background:#0d2b26;color:#f4f1ea;
        display:flex;flex-direction:column;justify-content:space-between;font-family:"Geist",sans-serif;position:relative;overflow:hidden}
  .mono{font-family:"Geist Mono",monospace}
  .dim{opacity:.55}
  .nav{font-size:30px;display:flex;gap:16px}
  .nav b{font-weight:400;background:#f4f1ea;color:#0d2b26;padding:0 4px}
  h1{font:400 128px/1 "Geist Mono",monospace;margin:0}
  p{font-size:40px;margin:22px 0 0;max-width:820px;line-height:1.3}
  svg{position:absolute;right:70px;top:120px}
</style></head><body>
<div class="card" id="card">
  <div class="nav mono" id="nav"></div>
  <div><h1 id="title"></h1><p class="dim" id="line"></p></div>
  <div class="mono dim" style="font-size:28px" id="foot"></div>
  <svg id="coins" width="360" height="390" viewBox="0 0 360 390" fill="none" stroke="#f4f1ea" stroke-width="2"></svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const coins = q.get('kind') === 'coins';
  document.getElementById('nav').innerHTML = coins
    ? '<span>[yashw.xyz]</span><span class="dim">•</span><span>[cv]</span><span class="dim">•</span><b>[coins]</b>'
    : '<b>[yashw.xyz]</b><span class="dim">•</span><span>[cv]</span><span class="dim">•</span><span>[coins]</span>';
  document.getElementById('title').textContent = coins ? 'Coins' : 'Yash Jain';
  document.getElementById('line').textContent = coins
    ? 'Coins and banknotes from around the world, laid out on a map.'
    : 'Software engineer. I build the systems that bring cloud infrastructure back when it breaks.';
  document.getElementById('foot').textContent = 'yashw.xyz';
  if (coins) document.getElementById('line').style.maxWidth = '640px';   // clear of the circles
  // Outline circles, as on the coin map: only on the coins card.
  if (coins) document.getElementById('coins').innerHTML =
    [[250,90,70],[110,70,38],[150,190,52],[290,240,30],[70,200,22],[210,320,44],[90,320,26],[320,330,16]]
      .map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('');
</script></body></html>
